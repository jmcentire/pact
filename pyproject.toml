[project]
name = "pact-agents"
version = "1.2.0"
description = "Contract-first multi-agent software engineering. Contracts before code. Tests as law. Agents that can't cheat."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "Wander"},
    {name = "blast_hardcheese"},
]
keywords = ["multi-agent", "llm", "contracts", "testing", "software-engineering", "ai-agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "pydantic>=2.0",
    "pytest>=8.2,<10",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://pact.tools"
Repository = "https://github.com/wandercom/pact"
Documentation = "https://pact.tools/docs/"

[project.scripts]
pact = "pact.cli:main"
pact-mcp = "pact.mcp_server:main"
pact-sim = "pact.vendor.simulacrum.runtime:main"

[project.optional-dependencies]
llm = [
    "anthropic>=0.40",
]
review = [
    "anthropic>=0.40",
]
openai = [
    "openai>=1.0",
]
gemini = [
    "google-genai>=1.0",
]
mcp = [
    "mcp>=1.0",
]
all-backends = [
    "anthropic>=0.40",
    "openai>=1.0",
    "google-genai>=1.0",
]
analysis = [
    "tree-sitter>=0.24",
    "tree-sitter-python>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
]
transmogrifier = [
    "transmogrifier>=0.2.0",
]
dev = [
    "pytest-asyncio>=1.3,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pact"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-x -q"
